version: 2

project_name: "obocop"

builds:
  - id: build-darwin
    main: .
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "github.com/obot-platform/obocop/pkg/version.Tag=v{{ .Version }}"
    hooks:
      post:
        # Developer ID sign + notarize the bare binary (same Quill setup
        # as obot's release). Snapshot builds ad-hoc sign only.
        - cmd: quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv
          env:
            - QUILL_LOG_FILE=/tmp/quill-{{ .Target }}.log

  - id: build-other
    main: .
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "github.com/obot-platform/obocop/pkg/version.Tag=v{{ .Version }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  github:
    owner: "obot-platform"
    name: "obocop"
  make_latest: false
  prerelease: auto
