name: release

# On a release tag: run the full build.yaml pipeline with the tag
# version (which builds, pushes, and signs the
# ghcr.io/<repo>/mdm-assets:<version> image), then publish — promote the
# image to :vX.Y.Z and :latest, and create a GitHub release carrying the
# installers, the assets tarball, and a cosign-signed checksums file.
# Prerelease tags (v1.2.3-rc1) are skipped entirely: MSI ProductVersion
# must be numeric x.y.z and obocop only ships via the MDM installers.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip the v prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yaml
    permissions:
      id-token: write
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}/mdm-assets
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist
      - name: Download MDM assets
        uses: actions/download-artifact@v4
        with:
          name: mdm-assets
          path: dist/mdm-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      # Checksums over every release asset, signed keyless with the
      # workflow's OIDC identity; verify with
      #   cosign verify-blob --bundle checksums.txt.sigstore.json checksums.txt
      - name: Checksum and sign release assets
        run: |
          tar -czf dist/mdm-assets.tar.gz -C dist/mdm-assets .
          (cd dist && sha256sum obocop.msi obocop.intunewin mdm-assets.tar.gz > checksums.txt)
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Create release and upload assets
        run: |
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            dist/obocop.msi \
            dist/obocop.intunewin \
            dist/mdm-assets.tar.gz \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json

      # build.yaml's image job already pushed and signed :<version>
      # (org-only — fork releases carry the tarball but no image);
      # promote that manifest to the release tags. The signature is
      # attached to the digest, so it covers the new tags as-is.
      - name: Log in to GitHub Container Registry
        if: ${{ github.repository_owner == 'obot-platform' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup crane
        if: ${{ github.repository_owner == 'obot-platform' }}
        uses: imjasonh/setup-crane@v0.5
      - name: Promote image tags
        if: ${{ github.repository_owner == 'obot-platform' }}
        run: |
          crane tag "${IMAGE}:${VERSION}" "${GITHUB_REF_NAME}"
          crane tag "${IMAGE}:${VERSION}" latest
