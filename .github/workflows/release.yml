name: release

# On a release tag: run the full build.yaml pipeline with the tag
# version, then create a GitHub release carrying the installers, the
# assets tarball, and a cosign-signed checksums file.
# Prerelease tags (v1.2.3-rc1) are skipped entirely: MSI ProductVersion
# must be numeric x.y.z and obot-sentry only ships via the MDM installers.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  version:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip the v prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist
      - name: Download MDM assets
        uses: actions/download-artifact@v4
        with:
          name: mdm-assets
          path: dist/mdm-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      # Checksums over every release asset, signed keyless with the
      # workflow's OIDC identity; verify with
      #   cosign verify-blob --bundle checksums.txt.sigstore.json checksums.txt
      - name: Checksum and sign release assets
        run: |
          tar -czf dist/mdm-assets.tar.gz -C dist/mdm-assets .
          (cd dist && sha256sum obot-sentry.msi obot-sentry.intunewin mdm-assets.tar.gz > checksums.txt)
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Create release and upload assets
        run: |
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            dist/obot-sentry.msi \
            dist/obot-sentry.intunewin \
            dist/mdm-assets.tar.gz \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json
