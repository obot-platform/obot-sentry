name: build

# Builds the MDM assets end to end: compiled binaries (Windows exe,
# macOS universal binary) → platform installers → assembled
# dist/mdm-assets (manifest + files), published as the mdm-assets
# workflow artifact obot consumes (OBOT_SERVER_MDM_ASSETS_PATH).
# `make mdm` dispatches this workflow and downloads the artifact.
#
# release.yml calls this workflow with the tag version and publishes
# the assets on the GitHub release.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version (numeric x.y.z); leave empty for an auto-bumped 0.0.<run number> dev version"
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Artifact version (numeric x.y.z)"
        type: string
        required: true

env:
  # MSI ProductVersion must be numeric x.y.z, so dev builds version as
  # 0.0.<run number> — monotonic, so successive main builds supersede
  # each other as MSI upgrades on devices tracking the dev channel. (The
  # build field caps at 65535; only a concern after 65k dev runs.)
  VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}

jobs:
  # All release binaries via GoReleaser (.goreleaser.yaml): the Windows
  # amd64 exe plus the macOS universal (amd64+arm64) binary, each stamped
  # with VERSION so the binaries, the MSI ProductVersion, and the
  # manifest's obotSentryVersion always agree. GoReleaser's built-in
  # notarize support (anchore/quill as a library) signs + notarizes the
  # macOS binary from Linux — no macOS runner. Signing turns on when
  # QUILL_SIGN_P12 is present; PRs, and forks without the QUILL_*
  # secrets, skip it and ship the Go linker's ad-hoc signature.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
        env:
          QUILL_SIGN_P12: ${{ github.event_name != 'pull_request' && secrets.QUILL_SIGN_P12 || '' }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
      - name: Stage binaries
        run: |
          mkdir -p bin
          cp dist/*_windows_amd64*/obot-sentry.exe bin/
          cp dist/*_darwin_all/obot-sentry bin/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/*
          if-no-files-found: error

  # Windows MSI + .intunewin on a Windows runner: WiX Toolset v4 (the
  # cross-platform `wix` .NET tool, pinned), wrapped by Microsoft's
  # Win32 Content Prep Tool (Windows-only). Same scripts as local runs;
  # the exe comes prebuilt from the binaries job.
  windows:
    needs: binaries
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin
      - name: Install WiX Toolset v4
        run: dotnet tool install --global wix --version 4.0.6
      # Pinned download from Microsoft's official repository, put on PATH
      # for intunewin.ps1 — same provisioning pattern as the WiX toolset.
      - name: Install Win32 Content Prep Tool
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/v1.8.6/IntuneWinAppUtil.exe' -OutFile "$env:RUNNER_TEMP\IntuneWinAppUtil.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $env:RUNNER_TEMP
      - name: Build MSI + .intunewin
        shell: pwsh
        run: |
          ./build/windows/msi.ps1 -Version $env:VERSION -Exe bin/obot-sentry.exe
          ./build/windows/intune/intunewin.ps1
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            dist/*.msi
            dist/*.intunewin
          if-no-files-found: error

  # Assemble dist/mdm-assets (build/mdm-assets.sh: manifest completion +
  # sanity checks + staging) and publish it as a workflow artifact.
  mdm-assets:
    needs: [binaries, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: dist
      - name: Assemble MDM assets
        run: ./build/mdm-assets.sh "${VERSION}"
      - name: Upload MDM assets
        uses: actions/upload-artifact@v4
        with:
          name: mdm-assets
          path: dist/mdm-assets
          if-no-files-found: error
